<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento - Green Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        .loader-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bolla centrale con logo */
        .logo-bubble {
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #0072ce, #009A17);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 114, 206, 0.3);
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }

        .logo-bubble img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* Animazione pulsazione bolla */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 40px rgba(0, 114, 206, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 50px rgba(0, 154, 23, 0.4);
            }
        }

        /* Container trattini orbitanti */
        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate 4s linear infinite;
        }

        .orbit:nth-child(2) {
            animation-duration: 5s;
            animation-direction: reverse;
        }

        .orbit:nth-child(3) {
            animation-duration: 6s;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Trattini */
        .dash {
            position: absolute;
            width: 4px;
            height: 20px;
            border-radius: 2px;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        /* Colori alternati blu e verde */
        .dash.blue {
            background-color: #0072ce;
            box-shadow: 0 0 10px rgba(0, 114, 206, 0.5);
        }

        .dash.green {
            background-color: #009A17;
            box-shadow: 0 0 10px rgba(0, 154, 23, 0.5);
        }

        /* Posizionamento trattini in cerchio */
        .dash:nth-child(1) { transform: translate(-2px, -10px) rotate(0deg) translateY(-140px); }
        .dash:nth-child(2) { transform: translate(-2px, -10px) rotate(30deg) translateY(-140px); }
        .dash:nth-child(3) { transform: translate(-2px, -10px) rotate(60deg) translateY(-140px); }
        .dash:nth-child(4) { transform: translate(-2px, -10px) rotate(90deg) translateY(-140px); }
        .dash:nth-child(5) { transform: translate(-2px, -10px) rotate(120deg) translateY(-140px); }
        .dash:nth-child(6) { transform: translate(-2px, -10px) rotate(150deg) translateY(-140px); }
        .dash:nth-child(7) { transform: translate(-2px, -10px) rotate(180deg) translateY(-140px); }
        .dash:nth-child(8) { transform: translate(-2px, -10px) rotate(210deg) translateY(-140px); }
        .dash:nth-child(9) { transform: translate(-2px, -10px) rotate(240deg) translateY(-140px); }
        .dash:nth-child(10) { transform: translate(-2px, -10px) rotate(270deg) translateY(-140px); }
        .dash:nth-child(11) { transform: translate(-2px, -10px) rotate(300deg) translateY(-140px); }
        .dash:nth-child(12) { transform: translate(-2px, -10px) rotate(330deg) translateY(-140px); }

        /* Testo caricamento */
        .loading-text {
            position: absolute;
            bottom: -60px;
            font-size: 1.125rem;
            font-weight: 500;
            color: #4b5563;
            animation: fadeInOut 1.5s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Fade out finale */
        body.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <!-- Orbita 1 -->
        <div class="orbit">
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
        </div>

        <!-- Orbita 2 (inversa) -->
        <div class="orbit">
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
            <div class="dash green"></div>
            <div class="dash blue"></div>
        </div>

        <!-- Bolla centrale con logo -->
        <div class="logo-bubble">
            <img src="logo-goccia.png" alt="Green Life Logo">
        </div>

        <!-- Testo caricamento -->
        <div class="loading-text">Caricamento...</div>
    </div>

    <script>
        // Redirect a index.html dopo 2 secondi
        setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }, 2000);
    </script>
</body>
</html>
